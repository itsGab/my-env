services:
  dev:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: devenv
    init: true
    container_name: devcont
    volumes:
      - ./Projects:/workspace/Projects:rw
      - ./.bash_aliases:/workspace/.bash_aliases:ro
    stdin_open: true
    tty: true
    restart: no
    networks:
      - devnet
    healthcheck:
      test: [ "CMD", "test", "-d", "/workspace/Projects" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  devnet:
    driver: bridge
