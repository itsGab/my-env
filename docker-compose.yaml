services:
  dev:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: devenv
    init: true
    container_name: devcont
    volumes:
      - ./Projects:/workspace/Projects
      - ./.bash_aliases:/workspace/.bash_aliases
    stdin_open: true
    tty: true
    restart: "no"
